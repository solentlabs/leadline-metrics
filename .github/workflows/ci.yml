name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs this same gate on the tag before it publishes.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: make setup
      - run: make check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned: setup-python's last 3.8 build exists for ubuntu-24.04 but not for
        # 26.04, which ubuntu-latest becomes in late 2026 (docs/ARCHITECTURE_DECISIONS.md).
        os: [ubuntu-24.04]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        # macOS and Windows on the newest Python; tests of the script's code skip on Windows (docs/TESTING.md).
        include:
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
